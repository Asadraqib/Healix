server:
  port: 8082
  error:
    include-message: always
    include-exception: true
spring:
  application:
    name: maintenance-service
  config:
    import: optional:classpath:.env.properties
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      max-lifetime: 240000
      connection-init-sql: SET search_path TO maintenance,public
  flyway:
    default-schema: maintenance
    create-schemas: true
management:
  endpoints:
    web:
      exposure:
        include: health,info