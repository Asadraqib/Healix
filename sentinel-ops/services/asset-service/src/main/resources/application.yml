server:
  port: 8081
  error:
    include-message: always
    include-exception: true
telemetry:
  generator:
    enabled: ${TELEMETRY_GENERATOR_ENABLED:true}
spring:
  task:
    scheduling:
      pool:
        size: 3
  application:
    name: asset-service
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      max-lifetime: 240000
      connection-init-sql: SET search_path TO asset,public
  flyway:
    default-schema: asset
    create-schemas: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
